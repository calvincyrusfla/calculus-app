# Static site: no build step. Netlify serves the repository root.
[build]
  publish = "."
  command = ""

# Serverless function for the AI tutor (served at /api/tutor).
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
